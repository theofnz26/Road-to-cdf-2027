<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Road to CDF 2027 - Calendrier</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <h1>Road to CDF 2027</h1>

  <nav>
    <a href="index.html">Accueil</a>
    <a href="roadmap.html">Decks</a>
  </nav>
</header>

<main>
  <section>
    <h2>Ajouter un événement</h2>

    <form id="eventForm">
      <label for="eventDate">Date</label>
      <input type="date" id="eventDate">

      <label for="eventType">Type</label>
      <select id="eventType">
        <option value="Tournoi">Tournoi</option>
        <option value="Entraînement">Entraînement</option>
        <option value="Régional">Régional</option>
        <option value="Autre">Autre</option>
      </select>

      <label for="eventName">Nom de l'événement</label>
      <input type="text" id="eventName" placeholder="Ex : Local boutique">

      <label for="eventDeck">Deck prévu</label>
      <input type="text" id="eventDeck" placeholder="Ex : Blue-Eyes">

      <button type="submit">Ajouter l'événement</button>
    </form>

    <div id="eventList"></div>
  </section>
</main>

<footer>
  <div class="footer-content">
    <img src="img/theo.png" alt="Photo de Théo Fernandez" class="profile-picture">

  <div class="footer-info">
      <h3>Projet réalisé par Théo Fernandez</h3>
      <p>Étudiant en Développement Web et IA</p>
      <p>Email : theofernandezf26@gmail.com</p>
      <p>LinkedIn : <a href="https://www.linkedin.com/in/theofnz26" target="_blank">Mon LinkedIn</a></p>
      <a href="https://theofnz26.github.io/mon-site-vitrine/" target="_blank" class="portfolio-button">
        Voir mon site personnel
      </a>
    </div>
  </div>
</footer>

<script src="js/script.js"></script>
</body>
</html>
